apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seema-bellubbi/gitops-lab.git
    targetRevision: main
    path: apps/payment-api
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
