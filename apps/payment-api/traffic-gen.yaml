apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
      - name: curl
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - while true; do curl -s -o /dev/null "http://payment-api/pay?policy=POL1001"; sleep 0.5; done
        resources:
          requests: {cpu: 10m, memory: 16Mi}
