apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-api
  namespace: payments
  labels:
    app: payment-api
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: python:3.12-slim
        command: ["/bin/sh", "-c"]
        args:
        - pip install --no-cache-dir --quiet flask gunicorn azure-monitor-opentelemetry && exec gunicorn --bind 0.0.0.0:8080 --workers 2 --chdir /app app:app
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "v1"
        - name: ERROR_RATE
          value: "0"
        - name: EXTRA_LATENCY_MS
          value: "0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_SERVICE_NAME
          value: "payment-api"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.instance.id=$(POD_NAME),service.version=$(APP_VERSION)"
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: appinsights
              key: connection-string
        volumeMounts:
        - name: code
          mountPath: /app
        startupProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: code
        configMap:
          name: payment-api-code
  strategy:
    canary:
      steps:
      - setWeight: 25          # 1 of 4 pods on the new version
      - pause: {}              # wait for a human to promote (GIT-703 replaces this with an automatic check)
      - setWeight: 50          # 2 of 4 pods
      - pause: {duration: 2m}  # watch for 2 minutes
                               # after the last step: 100%
